name: Fiyat Takip Otomasyonu

on:
  schedule:
    - cron: '0 9 * * *' # Her gün sabah saat 09.00'da çalışır
  workflow_dispatch: # Elle tetiklenebilmesi için

permissions:
  contents: write # Botun dosyayı güncelleyip kaydetmesi için gerekli yetki

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Botu Calistir
        run: python fiyat_botu.py

      - name: Degisiklikleri Otomatik Kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik fiyat kontrolu yapildi"
          file_pattern: "fiyatlar.txt"
