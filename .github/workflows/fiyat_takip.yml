name: Fiyat Takip Otomasyonu

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iherb-fiyat-takip
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Botu Calistir
        run: |
          python fiyat_botu.py

      - name: Sonuclari Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fiyatlar.txt urun_durum.json
          git add debug_iherb.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi

          git commit -m "Otomatik iHerb fiyat kontrolu"
          git push origin HEAD:main
