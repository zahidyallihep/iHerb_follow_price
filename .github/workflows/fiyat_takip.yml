name: Fiyat Takip Otomasyonu

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: pip install requests beautifulsoup4

      - name: Botu Calistir
        run: python fiyat_botu.py

      - name: Sonuclari Guvenli Kaydet ve Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add fiyatlar.txt urun_durum.json
          git commit -m "Otomatik fiyat ve hafiza guncellendi" || echo "Degisiklik yok"
          git push origin main
