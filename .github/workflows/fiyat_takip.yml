name: Fiyat Takip Otomasyonu

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Botu Calistir
        run: python fiyat_botu.py

      - name: Sonuclari Kaydet ve Guncelle
        run: |
          git config --global user.name "Fiyat Botu"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --rebase || true
          git add fiyatlar.txt urun_durum.json || true
          git commit -m "Otomatik fiyat kontrolu yapildi" || echo "Degisiklik yok"
          git push origin main || echo "Push yapilamadi"
